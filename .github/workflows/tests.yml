name: Test bun
run-name: ${{ github.actor }} is testing the package with bun using GitHub Actions 🚀
on:
  push:
  pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
            statuses: write
            pull-requests: write
        steps:
            - name: Check out repository code
              uses: actions/checkout@v4
            - name: Set up bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: '1.4.4'
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: jest test with Coverage
              continue-on-error: true
              run: bunx jest --json --outputFile=jest-results.json --coverage
            - name: Test results artifact
              uses: actions/upload-artifact@v4
              with:
                name: jest-results.json
                path: jest-results.json
                compression-level: 9
            - name: Test coverage artifact
              uses: actions/upload-artifact@v4
              with:
                name: coverage
                path: coverage/
                compression-level: 9
            - run: echo "🍏 This job's status is ${{ job.status }}."