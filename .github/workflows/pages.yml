name: Build bun
run-name: ${{ github.actor }} is building the bundle with bun using GitHub Actions 🚀
on:
  workflow_run:
    workflows: ["Test bun"]
    types:
      - completed
  push:
    branches:
      - main
      - master

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build bundle
        run: bun run build
      - name: Create page artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marvelcdb-filtering
      - run: echo "🍏 This job's status is ${{ job.status }}."
  deploy:
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4