<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://marvelcdb.com/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="text-scale" content="scale" />
  <meta name="theme-color" content="#202020" />
  <title>MarvelCDB filtering</title>
  <style>
    /* Boot styles: the app's StyleX and tokens.css are not available yet. */
    html, body { margin: 0; background: #202020; }
    .boot {
      display: grid;
      place-items: center;
      height: 100svh;
    }
    .boot__spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 4px solid #3A3A3A;
      border-top-color: #EC1D24;
      border-radius: 50%;
      animation: boot-spin 750ms linear infinite;
    }
    .boot__label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot__spinner { animation-duration: 2000ms; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="boot">
      <div class="boot__spinner" role="status">
        <span class="boot__label">Loading...</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
